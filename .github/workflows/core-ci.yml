name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset release -DSIM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset release --parallel 2
      - name: Test
        run: ctest --preset release

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset debug -DSIM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset debug --parallel 2
      - name: Test
        run: ctest --preset debug

  gdextension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset debug-godot
      - name: Build
        run: cmake --build --preset debug-godot --parallel 2
      - name: Test core through GDExtension preset
        run: ctest --preset debug-godot
      - name: Download Godot 4.5.1
        run: |
          curl -fL "https://godot-releases.nbg1.your-objectstorage.com/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
      - name: Import Godot project
        run: /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path godot --import
      - name: Smoke-run Godot project
        run: /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path godot --quit-after 3
